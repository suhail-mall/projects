meta:
  start time:
    from: today
    mean: 90
    spread: 30


fact table:
  - name: order
    description: orders that a person has placed
    columns:
      - name: id
        gen type : regex
        gen value: '[a-z]{4}\d{4}'
      - name: item id
        gen type : regex
        gen value: '[a-z]{4}\d{4}'
      - name: customer id
        gen type : regex
        gen value: '[a-z]{4}\d{4}'
      - name: order date
      - name: shipped from
        gen type : regex
        gen value: '[a-z]{4}\d{4}'

dimension tables:
  - name: delivery
    description: info about the company delivering the item
    nr rows: 5
    unique: company name
    columns:
      - name: id
        gen type: regex
        gen value: '[a-z]{4}\d{4}'
      - name: company name
        gen type: choice
        gen value: [Royal Mail, Whistl, Evri, DPD, MyHermes]
        gen probability: [1, 1, 1, 1, 1]
      - name: contact number
        gen type: regex
        gen value: '07\d{9}'
  - name: customer
    description: info about a person that has placed an order
    nr rows: 100
    columns:
      - name: id
        gen type: regex
        gen value: '[a-z]{4}\d{4}'
      - name: email address
        gen type: regex
        gen value: '[a-z]{4,8}@gmail[.]com'
      - name: phone number
        gen type: regex
        gen value: '07\d{9}'
      - name: password
        gen type: regex
        gen value: '.{6-8}'
#  - name: warehouse
#    description: info around a particular warehouse that houses items
#    columns:
#      - name: id
#      - name: region
#      - name: address
  - name: item
    description: items that can be purchased
    nr rows: 4
    columns:
      - name: id
        gen type: regex
        gen value: '[a-z]{6-8}'
      - name: item description
        gen type: choice
        gen value: [toy, gardening tool, bag, clothes]
        gen probability: [1, 1, 2, 3]
      - name: item price
        gen type: correlate # Has to be in the same record as the column it correlates with
        gen value: [5, 10, 100, 60]
        correlate with: item description

foreign keys:
  - dim table: customer
    fact key: customer id
    dim key: id
  - dim table: warehouse
    fact key: storage location
    dim key: id
  - dim table: item
    fact key: storage location
    dim key: id

activities:
  - name: order placed
    columns:
      - name: item id
      - name: id
      - name: shipped from
        value: TEST
    timestamp:
      table: order
      column: order date
    time mean: 5
    time spread: 1
    multiple activities: True # Can you put multiple activities in one line in the final data

followed by:
  - name: START
    followed activities:
      - [order placed, 1]
      - [order cancelled, 1]
  - name: order placed
    followed activities:
      - [order cancelled, 0.1]
      - [order packaged, 0.6]
      - [order shipped from 3rd party vendor, 0.3]